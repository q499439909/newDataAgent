[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataagent-cli"
version = "0.1.0"
description = "DataAgent image data production CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.139,<0.140",
  "httpx>=0.27,<1",
  "langgraph>=1.2,<1.3",
  "langgraph-checkpoint-sqlite>=3.1,<3.2",
  "Pillow>=10,<13",
  "pydantic>=2.8,<3",
  "rich>=13.7,<15",
  "sqlalchemy>=2.0,<2.1",
  "typer>=0.12,<1",
  "uvicorn>=0.51,<0.52",
]

[project.optional-dependencies]
milvus = ["pymilvus>=2.4,<3"]
dev = ["pytest>=8,<9"]

[project.scripts]
dataagent = "dataagent.cli:app"
dataagent-api = "apps.api.runner:main"
dataagent-tui = "apps.tui.runner:main"
dataagent-worker = "apps.worker.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["dataagent", "apps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
