[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataagent-cli"
version = "0.1.0"
description = "DataAgent image data production CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "Pillow>=10,<13",
  "pydantic>=2.8,<3",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
milvus = ["pymilvus>=2.4,<3"]
dev = ["pytest>=8,<9"]

[project.scripts]
dataagent = "dataagent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["dataagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

